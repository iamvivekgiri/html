<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested and Responsive Table</title>
    <style>
        .table-container {
            overflow-x: auto;
        }
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 12px;
        }
        .outer-table > thead > tr > th,
        .outer-table > tbody > tr > td {
            text-align: center;
        }
        .inner-table td {
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="table-container">
        <table class="outer-table">
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Lab Batches</th>
                    <th>Faculty</th>
                    <th>Room</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Friday</td>
                    <td>
                        <table class="inner-table">
                            <thead>
                                <tr>
                                    <th>Batch</th>
                                    <th>System</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>A1</td>
                                    <td>PC 1-20</td>
                                </tr>
                                <tr>
                                    <td>A2</td>
                                    <td>PC 21-40</td>
                                </tr>
                            </tbody>
                        </table>
                    </td>
                    <td>Dr. Sharma</td>
                    <td>Lab 2</td>
                    <td>2-4 PM</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
